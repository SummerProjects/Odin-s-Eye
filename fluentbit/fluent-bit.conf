[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# ============================================================== #
# INPUT: TAIL docker log files from all containers               #
# ============================================================== #
[INPUT]
    Name              tail
    Tag               iowrt.*
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    DB                /var/log/flb_iowrt.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    Read_From_Head    true

# ============================================================== #
# INPUT: System Metrics                                          #
# ============================================================== #

[INPUT]
    Name cpu
    Tag  system.cpu

[INPUT]
    Name mem
    Tag  system.mem

[INPUT]
    Name disk
    Tag  system.disk

# ============================================================== #
# FILTER: Add labels to iowrt.* logs                             #
# ============================================================== #
[FILTER]
    Name        modify
    Match       iowrt.*
    Add         source_type   log
    Add         source        iowrt
    Add         log_type      syslog
    Add         container     cpe-1
    Add         category      cpu-simulation
    Add         host          ${HOSTNAME}
    Add         metric_type   system


[FILTER]
    Name        modify
    Match       system.cpu
    Add         metric_type   cpu
    Add         source_type   metric
    Add         host          ${HOSTNAME}

[FILTER]
    Name        modify
    Match       system.mem
    Add         metric_type   memory
    Add         source_type   metric
    Add         host          ${HOSTNAME}

[FILTER]
    Name        modify
    Match       system.disk
    Add         metric_type   disk
    Add         source_type   metric
    Add         host          ${HOSTNAME}



# ============================================================== #
# OUTPUT: Send everything to Loki                                #
# ============================================================== #
[OUTPUT]
    Name        loki
    Match       *
    Host        loki
    Port        3100
    URI         /loki/api/v1/push
    Labels      job=fluentbit,source_type=$source_type,log_type=$log_type,metric_type=$metric_type,host=$host,container=$container,source=$source,category=$category
    Line_Format json

# (Optional) For troubleshooting, also send everything to stdout
[OUTPUT]
    Name  stdout
    Match *
