[PARSER]
    Name   syslog
    Format regex
    Regex  ^<(?<pri>[0-9]+)>(?<time>[^ ]+ [^ ]+ [^ ]+) (?<host>[^ ]+) (?<ident>[^:]+): (?<message>.+)$
    Time_Key time
    Time_Format %b %d %H:%M:%S

[PARSER]
    Name   json
    Format json

[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
    Decode_Field_As   escaped     log
